name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version number from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build plugin zip
        run: |
          mkdir -p build/ol-rss-featured-image
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.vscode' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='build' \
            ./ build/ol-rss-featured-image/
          cd build
          zip -r ol-rss-featured-image-${{ steps.get_version.outputs.VERSION }}.zip ol-rss-featured-image

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/ol-rss-featured-image-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}